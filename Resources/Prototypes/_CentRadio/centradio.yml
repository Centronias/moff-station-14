- type: entity
  parent: BaseItem
  id: CrMdMicrophone
  name: microdevice microphone
  components:
  - type: Sprite
    layers:
    - sprite: _dev.rsi
      state: pink
  - type: Microphone
  - type: ActiveListener

- type: entity
  parent: BaseItem
  id: CrMdSpeaker
  name: microdevice speaker
  components:
  - type: Sprite
    layers:
    - sprite: _dev.rsi
      state: green
  - type: Speaker
  - type: Speech
    speechVerb: Robotic

- type: entity
  parent: BaseItem
  id: CrMicrodeviceContainerEcho
  name: echo microdevice
  components:
  - type: Sprite
    layers:
    - sprite: _dev.rsi
      state: red
  - type: MicrodeviceContainer
    containers:
    - "speaker"
    - "microphone"
    connections:
    - [ [ 1, { name: "audio" } ], [ 0, { name: "audio" } ] ]
    # I'd really rather this look like
  #      speaker:
  #        audio: [ microphone, audio ]
  - type: ContainerContainer
  - type: EntityTableContainerFill
    containers:
      speaker:
        id: CrMdSpeaker
      microphone:
        id: CrMdMicrophone

- type: entity
  parent: BaseItem
  id: CrMdCassette
  name: microdevice cassette tape
  component:
  - type: Sprite
    layers:
    - sprite: _dev.rsi
      state: brown
  - type: Cassette

- type: entity
  parent: BaseItem
  id: CrMdCassetteReader
  name: microdevice cassette reader
  components:
  - type: Sprite
    layers:
    - sprite: _dev.rsi
      state: pink
  - type: CassetteContainer
  - type: CassetteReader
  - type: ItemSlots
    slots:
      cassette:
        whitelist:
          components: Cassette

- type: entity
  parent: BaseItem
  id: CrMicrodeviceContainerCassetteReader
  name: cassette reader microdevice
  components:
  - type: Sprite
    layers:
    - sprite: _dev.rsi
      state: red
  - type: MicrodeviceContainer
    containers:
    - "speaker"
    - "cassette"
    connections:
    - [ [ 1, { name: "audio" } ], [ 0, { name: "output" } ] ]
    # I'd really rather this look like
  #      speaker:
  #        audio: [ cassette, output ]
  - type: ContainerContainer
  - type: EntityTableContainerFill
    containers:
      speaker:
        id: CrMdSpeaker
      cassette:
        id: CrMdCassetteReader
